name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Generate archive changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --use-branch-tags
        env:
          OUTPUT: ${{ runner.temp }}/CHANGELOG.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANGELOG: ${{ runner.temp }}/CHANGELOG.md

  changelog:
    needs: release
    runs-on: ubuntu-latest

    concurrency:
      group: changelog-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate repository changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --use-branch-tags
        env:
          OUTPUT: CHANGELOG.md

      - name: Open changelog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHANGELOG_BRANCH: changelog/${{ github.ref_name }}
        run: |
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Changelog is already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$CHANGELOG_BRANCH"
          git commit -m "chore: update changelog"
          git push --force origin "$CHANGELOG_BRANCH"

          if [ "$(gh pr list --head "$CHANGELOG_BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Changelog pull request is already open; branch updated."
            exit 0
          fi

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$CHANGELOG_BRANCH" \
            --title "chore: update changelog" \
            --body "Automated changelog update generated after the ${GITHUB_REF_NAME} release."
